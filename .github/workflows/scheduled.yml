name: Update cask.json
on:
  push:
    branches: [main]
  schedule:
    # At 06:00 every day
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ENV_HINTS: 1
  HOMEBREW_BOOTSNAP: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  update:
    runs-on: macos-15
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Generate cask.json
        run: |
          # Clean up
          rm -rf _data/cask
          mkdir -p _data/cask

          # Import taps
          . taps

          # Register all the taps. The taps file is an explicit trust list, so
          # trust third-party taps before Homebrew loads their cask definitions.
          for tap in "${TAPS[@]}"; do
            brew tap --force "$tap"
            if [[ "$tap" != homebrew/* ]]; then
              brew trust --tap "$tap"
            fi
          done

          brew update

          # Generate cask JSON files. generate-cask.rb fails the job if any cask
          # cannot be loaded instead of silently publishing incomplete data.
          for tap in "${TAPS[@]}"; do
            brew ruby ./generate-cask.rb "$tap"
          done

          # Merge cask JSON files into a single array.
          jq -n '[inputs]' _data/cask/*.json > raw.json

      - name: Simplify cask.json
        run: jq -c 'map(del(.tap_git_head,.installed_time,.installed,.ruby_source_path,.ruby_source_checksum))' raw.json > cask.json && rm raw.json

      - name: Validate JSON
        run: jq empty cask.json

      - name: Commit and push changes
        run: |
          git add cask.json

          if git diff --cached --quiet; then
            echo "cask.json is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update casks"
          git push
