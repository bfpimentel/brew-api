<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse Homebrew casks and third-party taps.">
  <title>Brew API — Cask catalog</title>
  <link rel="stylesheet" href="assets/pico.min.css">
  <link rel="stylesheet" href="assets/dashboard.css">
  <script src="assets/dashboard.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="./" aria-label="Brew API home">
        <span class="wordmark-main">BREW</span><span class="wordmark-slash">/</span><span>API</span>
      </a>
      <div class="header-actions">
        <label class="search-field">
          <span class="visually-hidden">Search casks</span>
          <input id="q" type="search" placeholder="Search casks" autocomplete="off">
        </label>
        <button id="reload" class="secondary outline" type="button">Reload data</button>
      </div>
    </div>
  </header>

  <div class="shell">
    <div id="status" class="load-status" role="status" aria-live="polite">Loading cask.json…</div>
    <input id="file" class="file-picker" type="file" accept="application/json,.json">
  </div>

  <main class="shell dashboard">
    <aside class="filter-column" aria-label="Catalog filters">
      <details id="filters" class="filter-panel" open>
        <summary>Filters</summary>

        <fieldset>
          <legend>Taps</legend>
          <label class="filter-option filter-all">
            <input id="tap-all" type="checkbox" checked>
            <span>All taps</span>
          </label>
          <div id="tap-options" class="filter-options" aria-live="polite">
            <span class="muted">Loading taps…</span>
          </div>
        </fieldset>

        <fieldset>
          <legend>Include statuses</legend>
          <label class="filter-option">
            <input type="checkbox" name="status" value="outdated">
            <span>Outdated</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" name="status" value="deprecated">
            <span>Deprecated</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" name="status" value="disabled">
            <span>Disabled</span>
          </label>
        </fieldset>
      </details>
    </aside>

    <section class="catalog" aria-labelledby="catalog-title">
      <header class="catalog-header">
        <div>
          <p class="eyebrow">Cask catalog</p>
          <h1 id="catalog-title">Available software</h1>
        </div>
        <p id="result-summary" class="result-summary">Loading…</p>
      </header>

      <div id="loading" class="loading" aria-label="Loading casks">
        <span aria-busy="true">Reading cask metadata…</span>
      </div>
      <div id="results" class="result-list" hidden></div>
      <div id="empty" class="empty" hidden>
        <strong>No matching casks</strong>
        <p>Try another search, tap, or status filter.</p>
      </div>

      <nav id="pager" class="pager" aria-label="Cask pages" hidden>
        <button id="prev" class="secondary outline" type="button">Previous</button>
        <span id="page" aria-live="polite"></span>
        <button id="next" class="secondary outline" type="button">Next</button>
      </nav>
    </section>
  </main>

  <dialog id="details" aria-labelledby="detail-title">
    <article class="detail-frame">
      <header class="detail-header">
        <div id="detail-heading"></div>
        <button id="close-details" class="secondary outline close-button" type="button" aria-label="Close cask details">Close</button>
      </header>
      <div id="detail-body" class="detail-body"></div>
    </article>
  </dialog>
</body>
</html>
